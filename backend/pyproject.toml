[project]
name = "decisiontrace-backend"
version = "0.1.0"
description = "DecisionTrace — Autonomous Decision & Commitment Guardian Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic-settings>=2.5.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.35,<2.1.0",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.0",
    "qdrant-client>=1.11.0",
    "fastembed>=0.3.6",
    "redis>=5.0.8",
    "rq>=1.16.2",
    "tenacity>=9.0.0",
    "pyjwt[crypto]>=2.9.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 130
target-version = "py312"
exclude = [
    ".venv",
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E712"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
